[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-trust-gateway"
version = "1.0.0"
description = "AI Software Trust Gateway - 本地开源 AI 软件可信安全网关"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ASTG Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.29",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.1",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]
celery = [
    "celery>=5.3.6",
    "redis>=5.0.3",
]
semgrep = [
    "semgrep>=1.65.0",
]
bandit = [
    "bandit>=1.7.8",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
]
all = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "bandit>=1.7.8",
    "semgrep>=1.65.0; platform_system != 'Windows'",
]

[project.scripts]
astg = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "cli*"]
exclude = ["frontend*", "fixtures*", "rules*", "schemas*", "artifacts*", "docs*"]

[tool.setuptools.data-files]
"share/astg/rules/scoring" = ["rules/scoring/mvp-static-v1.json"]
"share/astg/rules/semgrep" = ["rules/semgrep/python_rules.yaml", "rules/semgrep/javascript_rules.yaml"]
"share/astg/schemas" = ["schemas/ai-input-v1.json", "schemas/ai-output-v1.json", "schemas/report-v1.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
